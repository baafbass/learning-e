<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>LearnHub — Learn new skills online</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="LearnHub is an e-learning platform where instructors publish courses and students learn at their own pace, track progress and receive grades."
    />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
    />
    <script>
      // Apply the saved theme before Angular boots to avoid a flash of the wrong colours.
      try {
        const saved = localStorage.getItem('learnhub.theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
      } catch {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>LearnHub needs JavaScript enabled to run.</noscript>
  </body>
</html>
