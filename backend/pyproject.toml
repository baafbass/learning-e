[project]
name = "learnhub-api"
version = "1.0.0"
description = "REST API for the LearnHub e-learning platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/db/seed_data.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
